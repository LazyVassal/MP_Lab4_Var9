<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес Клуб</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>💪 Фитнес Клуб</h1>
        <button id="themeToggle">🌙 Тёмная тема</button>
    </header>

    <main>
        <div class="tabs">
            <button class="tab-btn active" data-tab="clients">Клиенты</button>
            <button class="tab-btn" data-tab="memberships">Абонементы</button>
            <button class="tab-btn" data-tab="trainings">Тренировки</button>
        </div>
        <!-- Вкладка Клиенты -->
        <div id="clients-tab" class="tab-content active">
            <h2>Клиенты клуба</h2>
            <form id="clientForm">
            </form>

                <div id="clientsList">
                    <table id="clientsTable" class="data-table">
                        <thead>
                            <tr>
                                <th>Имя</th>
                                <th>Телефон</th>
                                <th>Email</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Данные будут загружаться сюда через JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        <!-- Вкладка Абонементы -->
        <div id="memberships-tab" class="tab-content">
            <div id="activeMembershipsList">
                <h2>Абонементы</h2>
                <table id="membershipsTable" class="data-table">
                    <thead>
                        <tr>
                            <th>Клиент</th>
                            <th>Тип</th>
                            <th>Действует до</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Данные будут загружаться сюда через JS -->
                    </tbody>
                </table>
            </div>
        </div>
        <!-- Вкладка Тренировки -->
        <div id="trainings-tab" class="tab-content">
            <div id="trainingsHistoryList">
                <h2>Список тренировок</h2>
                <table id="trainingsTable" class="data-table">
                    <thead>
                        <tr>
                            <th>Клиент ID</th>
                            <th>Дата</th>
                            <th>Активность</th>
                            <th>Длительность (мин)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Данные будут загружаться сюда через JS -->
                    </tbody>
                </table>
            </div>
        </div>
 </main>

    <script src="script.js"></script>
</body>
</html>
